<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #10303a;
    --ink: #f3ead8;
    --muted: #9fbcc0;
    --accent: #f28c28;
    --panel: #173f4a;
  }
  html, body { background: var(--ground); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding-inline: 16px;
    padding-block: 32px 40px;
  }
  main { max-width: 960px; margin: 0 auto; display: grid; gap: 18px; }
  h1 {
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 400; font-size: clamp(28px, 5vw, 44px);
    margin: 0; letter-spacing: 0.04em; text-wrap: balance;
  }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); max-width: 60ch; }
  .stage { border-radius: 18px; overflow: hidden; line-height: 0; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .stage svg { width: 100%; height: auto; display: block; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  button {
    font: inherit; font-size: 15px; color: #1d1a16; background: var(--accent);
    border: 0; border-radius: 999px; padding: 8px 20px; cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  input[type="range"] { accent-color: var(--accent); width: 180px; max-width: 50vw; }
  output { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 5ch; }
</style>
</head>
<body>

<main>
  <h1>鹈鹕<span>骑车</span>去海边</h1>
  <p>一只鹈鹕叼着空空的喉囊，沿着黄昏的海岸公路一路蹬车。拖动滑块调节车速。</p>

  <div class="stage">
    <svg id="scene" viewBox="0 0 800 480" role="img" aria-label="一只鹈鹕在海边公路上骑自行车的动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b5d73"/>
          <stop offset="0.55" stop-color="#e98f6a"/>
          <stop offset="1" stop-color="#f7c77e"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0.55" stop-color="#ffe3a3"/>
          <stop offset="1" stop-color="#ffe3a3" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3f8c96"/>
          <stop offset="1" stop-color="#1f5c68"/>
        </linearGradient>
      </defs>

      <!-- sky & sun -->
      <rect width="800" height="480" fill="url(#sky)"/>
      <circle cx="610" cy="270" r="110" fill="url(#sunGlow)" opacity="0.7"/>
      <circle cx="610" cy="270" r="58" fill="#ffd98a"/>

      <!-- clouds -->
      <g id="clouds" fill="#fbe2c8" opacity="0.85"></g>

      <!-- sea -->
      <rect y="290" width="800" height="100" fill="url(#sea)"/>
      <g id="boat" fill="#1d3d47">
        <path d="M0,0 L40,0 L32,9 L6,9 Z"/>
        <path d="M18,-2 L18,-40 L36,-4 Z" fill="#f3ead8"/>
        <path d="M16,-2 L16,-32 L3,-4 Z" fill="#f7c77e"/>
      </g>
      <g id="waves" stroke="#9fd3d4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"></g>

      <!-- sand & road -->
      <rect y="382" width="800" height="22" fill="#e3c38e"/>
      <rect y="400" width="800" height="80" fill="#3a3945"/>
      <rect y="400" width="800" height="4" fill="#57566a"/>
      <g id="dashes" fill="#f3ead8" opacity="0.8"></g>

      <!-- speed lines -->
      <g id="speedlines" stroke="#f3ead8" stroke-width="3" stroke-linecap="round" opacity="0">
        <line x1="150" y1="180" x2="205" y2="180"/>
        <line x1="130" y1="220" x2="200" y2="220"/>
        <line x1="160" y1="262" x2="200" y2="262"/>
      </g>

      <!-- shadow -->
      <ellipse cx="370" cy="423" rx="185" ry="9" fill="#000" opacity="0.28"/>

      <!-- far leg + far crank (behind bike) -->
      <g id="farSide">
        <line id="farCrank" stroke="#8d8d99" stroke-width="7" stroke-linecap="round"/>
        <rect id="farPedal" width="22" height="7" rx="2" fill="#55555f"/>
        <line id="farThigh" stroke="#d3cdbf" stroke-width="18" stroke-linecap="round"/>
        <line id="farShin" stroke="#c46e1d" stroke-width="7" stroke-linecap="round"/>
        <polygon id="farFoot" fill="#c46e1d"/>
      </g>

      <!-- bicycle -->
      <g id="bike">
        <g id="rearWheel" transform="translate(250 350)">
          <circle r="70" fill="none" stroke="#1d1d24" stroke-width="9"/>
          <circle r="63" fill="none" stroke="#b9bfc6" stroke-width="2.5"/>
          <g class="spokes" stroke="#cfd4da" stroke-width="1.4"></g>
          <circle r="8" fill="#6c6f78"/>
          <circle r="12" fill="none" stroke="#6c6f78" stroke-width="3" stroke-dasharray="3 2"/>
        </g>
        <g id="frontWheel" transform="translate(490 350)">
          <circle r="70" fill="none" stroke="#1d1d24" stroke-width="9"/>
          <circle r="63" fill="none" stroke="#b9bfc6" stroke-width="2.5"/>
          <g class="spokes" stroke="#cfd4da" stroke-width="1.4"></g>
          <circle r="8" fill="#6c6f78"/>
        </g>

        <!-- chain -->
        <path id="chain" d="M360,336 L250,338 M250,362 L360,374" stroke="#2a2a30" stroke-width="3"
              stroke-dasharray="4 3" fill="none"/>

        <!-- frame -->
        <g stroke="#d94f3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M250,350 L360,355 L325,255 Z"/>
          <path d="M325,255 L457,246"/>
          <path d="M360,355 L465,285"/>
          <path d="M457,246 L467,288" stroke-width="12"/>
        </g>
        <path d="M466,284 L490,350" stroke="#b8b8c2" stroke-width="7" stroke-linecap="round"/>
        <!-- seat post, saddle -->
        <path d="M325,255 L319,236" stroke="#8d8d99" stroke-width="6" stroke-linecap="round"/>
        <path d="M296,232 Q318,224 340,232 Q320,240 296,232 Z" fill="#26252c"/>
        <!-- stem & bars -->
        <path d="M457,246 L452,224 L476,224 Q490,226 484,238" stroke="#8d8d99" stroke-width="6"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- chainring -->
        <circle cx="360" cy="355" r="19" fill="none" stroke="#8d8d99" stroke-width="4"/>
        <circle cx="360" cy="355" r="6" fill="#6c6f78"/>
        <!-- basket on the front -->
        <path d="M492,238 L540,238 L534,272 L498,272 Z" fill="#b98a4e" stroke="#7d5a2d" stroke-width="2"/>
        <path d="M498,250 L536,250 M500,261 L535,261 M506,238 L508,272 M520,238 L520,272" stroke="#7d5a2d" stroke-width="1.5"/>
        <!-- fish in basket -->
        <g transform="translate(514 234) rotate(-14)">
          <path d="M-18,0 Q0,-12 16,0 Q0,12 -18,0 Z" fill="#8fb8c9"/>
          <path d="M16,0 L27,-8 L25,0 L27,8 Z" fill="#8fb8c9"/>
          <circle cx="-10" cy="-2" r="1.8" fill="#1d1d24"/>
        </g>
      </g>

      <!-- pelican -->
      <g id="pelican">
        <!-- tail -->
        <path d="M268,196 L228,186 L240,200 L226,210 L270,214 Z" fill="#e7e1d3" stroke="#b9b2a2" stroke-width="2" stroke-linejoin="round"/>
        <!-- body -->
        <ellipse cx="332" cy="196" rx="74" ry="44" transform="rotate(-12 332 196)"
                 fill="#f6f3ec" stroke="#c9c2b2" stroke-width="2"/>
        <!-- head & neck -->
        <g id="head">
          <path d="M378,178 C412,150 392,120 424,98" stroke="#c9c2b2" stroke-width="30" fill="none" stroke-linecap="round"/>
          <path d="M378,178 C412,150 392,120 424,98" stroke="#f6f3ec" stroke-width="26" fill="none" stroke-linecap="round"/>
          <path d="M412,80 Q400,66 390,72 Q402,76 404,84 Z" fill="#f4d58d"/>
          <circle cx="430" cy="94" r="25" fill="#f6f3ec" stroke="#c9c2b2" stroke-width="2"/>
          <!-- pouch -->
          <path d="M448,102 Q462,146 520,128 L560,113 Z" fill="#e57a24" stroke="#b85d15" stroke-width="2" stroke-linejoin="round"/>
          <!-- upper mandible -->
          <path d="M444,86 L558,106 Q570,110 566,121 Q562,113 554,113 L448,103 Z"
                fill="#f6b53c" stroke="#c8861b" stroke-width="2" stroke-linejoin="round"/>
          <path d="M452,95 L548,108" stroke="#c8861b" stroke-width="1.5"/>
          <!-- eye -->
          <circle cx="434" cy="88" r="6" fill="#fff4d6" stroke="#e0a64a" stroke-width="1.5"/>
          <circle cx="435" cy="88" r="3.2" fill="#1d1d24"/>
          <circle cx="436.2" cy="86.8" r="1" fill="#fff"/>
        </g>
        <!-- folded wing -->
        <path d="M388,172 C352,156 292,166 256,198 L282,197 L266,211 L294,206 L284,219 Q344,218 384,196 Z"
              fill="#e9e4d7" stroke="#b9b2a2" stroke-width="2" stroke-linejoin="round"/>
        <path d="M300,196 L330,192 M308,206 L340,200" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round"/>
        <!-- wing reaching the handlebar -->
        <path d="M366,182 Q428,196 478,226 L486,236 Q472,238 460,232 Q412,214 360,202 Z"
              fill="#f1ede3" stroke="#b9b2a2" stroke-width="2" stroke-linejoin="round"/>
        <path d="M470,229 L480,240 M462,228 L470,240" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- near leg + near crank -->
      <g id="nearSide">
        <line id="nearThigh" stroke="#f6f3ec" stroke-width="20" stroke-linecap="round"/>
        <line id="nearShin" stroke="#f28c28" stroke-width="7" stroke-linecap="round"/>
        <line id="nearCrank" stroke="#b8b8c2" stroke-width="7" stroke-linecap="round"/>
        <rect id="nearPedal" width="24" height="8" rx="2" fill="#26252c"/>
        <polygon id="nearFoot" fill="#f28c28" stroke="#c46e1d" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="toggle" type="button">暂停</button>
    <label for="speed">车速
      <input id="speed" type="range" min="0" max="420" step="10" value="170">
      <output id="speedOut" for="speed">17 km/h</output>
    </label>
  </div>
</main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const mk = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    parent && parent.appendChild(el);
    return el;
  };

  // spokes
  document.querySelectorAll(".spokes").forEach((g) => {
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      mk("line", { x1: 0, y1: 0, x2: (63 * Math.cos(a)).toFixed(2), y2: (63 * Math.sin(a)).toFixed(2) }, g);
    }
  });

  // road dashes (two screens worth so the loop is seamless)
  const dashes = $("dashes");
  for (let x = 0; x < 960; x += 80) mk("rect", { x, y: 437, width: 42, height: 6, rx: 3 }, dashes);

  // waves
  const waves = $("waves");
  const waveRows = [305, 325, 348, 370];
  waveRows.forEach((y, r) => {
    let d = "";
    for (let x = -80 + r * 23; x < 900; x += 80) d += `M${x},${y} q10,-5 20,0 `;
    mk("path", { d, opacity: 0.5 + r * 0.12 }, waves);
  });

  // clouds
  const cloudsG = $("clouds");
  const cloudShape = (g, s) => {
    mk("ellipse", { cx: 0, cy: 0, rx: 46 * s, ry: 16 * s }, g);
    mk("ellipse", { cx: -18 * s, cy: -10 * s, rx: 22 * s, ry: 16 * s }, g);
    mk("ellipse", { cx: 14 * s, cy: -16 * s, rx: 26 * s, ry: 20 * s }, g);
  };
  const clouds = [
    { x: 120, y: 70, s: 1.1, v: 0.10 },
    { x: 470, y: 120, s: 0.8, v: 0.07 },
    { x: 760, y: 55, s: 1.3, v: 0.12 },
  ].map((c) => { c.g = mk("g", {}, cloudsG); cloudShape(c.g, c.s); return c; });

  const boat = $("boat");
  let boatX = 120;

  // geometry
  const BB = { x: 360, y: 355 }, CRANK = 28;
  const HIP_NEAR = { x: 336, y: 228 }, HIP_FAR = { x: 330, y: 224 };
  const L1 = 78, L2 = 76;

  const setLine = (el, a, b) => {
    el.setAttribute("x1", a.x.toFixed(1)); el.setAttribute("y1", a.y.toFixed(1));
    el.setAttribute("x2", b.x.toFixed(1)); el.setAttribute("y2", b.y.toFixed(1));
  };

  // two-bone IK, knee bends forward (toward +x)
  const solveKnee = (hip, foot) => {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, L1 + L2 - 0.5);
    const a = Math.atan2(dy, dx);
    const off = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    return { x: hip.x + L1 * Math.cos(a - off), y: hip.y + L1 * Math.sin(a - off) };
  };

  const drawSide = (prefix, angle, hip, bob) => {
    const p = { x: BB.x + CRANK * Math.cos(angle), y: BB.y + CRANK * Math.sin(angle) };
    const h = { x: hip.x, y: hip.y + bob };
    const foot = { x: p.x, y: p.y - 5 };
    const knee = solveKnee(h, foot);
    setLine($(prefix + "Crank"), BB, p);
    const pedal = $(prefix + "Pedal");
    pedal.setAttribute("x", (p.x - 11).toFixed(1));
    pedal.setAttribute("y", (p.y - 3.5).toFixed(1));
    setLine($(prefix + "Thigh"), h, knee);
    setLine($(prefix + "Shin"), knee, foot);
    const f = foot;
    $(prefix + "Foot").setAttribute("points",
      [[-8, -4], [6, -6], [24, -3], [18, 1], [24, 5], [-6, 4]]
        .map(([x, y]) => `${(f.x + x).toFixed(1)},${(f.y + y).toFixed(1)}`).join(" "));
  };

  const rearSpokes = document.querySelector("#rearWheel .spokes");
  const frontSpokes = document.querySelector("#frontWheel .spokes");
  const pelican = $("pelican"), head = $("head"), chain = $("chain");
  const dashesEl = dashes, wavesEl = waves, speedlines = $("speedlines");

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let speed = 170;            // px per second
  let running = !reduced;
  let dist = 0, last = null, t = 0;

  const toggle = $("toggle"), slider = $("speed"), out = $("speedOut");
  const syncButton = () => { toggle.textContent = running ? "暂停" : "出发"; };
  syncButton();
  toggle.addEventListener("click", () => { running = !running; last = null; syncButton(); });
  slider.addEventListener("input", () => {
    speed = +slider.value;
    out.textContent = `${Math.round(speed / 10)} km/h`;
  });

  const render = () => {
    const wheelDeg = (dist / 70) * 180 / Math.PI;
    rearSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
    frontSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);

    const crank = dist / 70 / 2.2;
    const bob = Math.sin(crank * 2) * 1.8;
    pelican.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
    const nod = Math.sin(crank * 2 + 0.8) * 2.5 + Math.sin(t * 0.9) * 1.5;
    head.setAttribute("transform", `rotate(${nod.toFixed(2)} 380 176)`);

    drawSide("far", crank + Math.PI, HIP_FAR, bob);
    drawSide("near", crank, HIP_NEAR, bob);

    chain.setAttribute("stroke-dashoffset", (dist * 0.35 % 7).toFixed(2));
    dashesEl.setAttribute("transform", `translate(${(-(dist % 80)).toFixed(1)} 0)`);
    wavesEl.setAttribute("transform", `translate(${(-(dist * 0.25 % 80) + Math.sin(t * 1.3) * 3).toFixed(1)} 0)`);

    clouds.forEach((c) => c.g.setAttribute("transform", `translate(${c.x.toFixed(1)} ${c.y})`));
    boat.setAttribute("transform", `translate(${boatX.toFixed(1)} ${(333 + Math.sin(t * 2) * 2).toFixed(1)}) rotate(${(Math.sin(t * 2 + 1) * 3).toFixed(1)})`);
    speedlines.setAttribute("opacity", Math.max(0, (speed - 180) / 240).toFixed(2));
    speedlines.setAttribute("transform", `translate(${(-(dist * 0.6 % 30)).toFixed(1)} 0)`);
  };

  const frame = (now) => {
    if (last === null) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (running) {
      t += dt;
      dist += speed * dt;
      clouds.forEach((c) => { c.x -= (speed * c.v + 4) * dt; if (c.x < -120) c.x = 920; });
      boatX -= (speed * 0.04 + 6) * dt;
      if (boatX < -60) boatX = 860;
    }
    render();
    requestAnimationFrame(frame);
  };

  dist = 37; // start mid-stroke so the still frame looks natural
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
